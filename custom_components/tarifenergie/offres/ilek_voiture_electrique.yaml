# 13,48 c€ au-delà) ; abonnement propre à ilek, très au-dessus du TRV. Réservée aux
# possesseurs (ou acquéreurs) d'une voiture électrique, sur attestation, avec un
# Linky communicant : condition non vérifiée par le moteur.
# Grille ID275 « Grille tarifaire au 1er août 2026 », relevée le 26/10/2026 avec
# pdftotext -layout. Option Heures creuses (#159) : plages propres à ilek, les mêmes
# pour tous les abonnés (fiche descriptive ID275 : « 4 heures creuses : de 1h à 3h et
# de 13h à 15h »), d'où une option à plages imposées (saison unique « annee »), et
# non les heures creuses Enedis du compteur ; 1h01-3h00 et 13h01-15h00 arrondies à
# l'heure (statistiques horaires). HC/HP TTC uniformes de 6 à 36 kVA (pas de 3 kVA).
# Option Super Heures Creuses (#160) : mêmes abonnements, HSC 3h01-7h00 (fiche : « 4 super
# heures creuses : de 3h à 7h ») en plus des mêmes HC ; HSC HT = HC HT du TRV - 43 %.
