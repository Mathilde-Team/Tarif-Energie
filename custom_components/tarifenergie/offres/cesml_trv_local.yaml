# Bleu résidentiel (issues #248 Base, #249 HC ; phase 2 des ELD, #189). Seul
# fournisseur du TRV sur son réseau (Hérault, ≤ 36 kVA) ; pas de filtre de zone
# dans le moteur (comme ÉS #72).
