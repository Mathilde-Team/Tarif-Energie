# EDF Vert Électrique Régional (issues #18 Base, #119 HC ; inventaire #6).
# « Autre offre » selon la CRE : prix HT révisables 2 fois par an par EDF, sans suivre
# le TRV ; évolutions de taxes répercutées immédiatement. Électricité verte d'origine
# éolienne régionale (garanties d'origine, label VertVolt « engagée »), sans
# engagement. Le client choisit une région de parcs éoliens : la page de l'offre
# publie une grille unique, sans écart de prix par région.
# Grille TTC « applicables à compter du 15 septembre 2026 pour toute nouvelle
# souscription » (page de l'offre). Pas d'option en 3 kVA. Particularité : le kWh
# Base à 6 kVA (20,37 c€) est moins cher qu'à partir de 9 kVA (20,65 c€).
# Majorations non modélisées (auto-producteur avec injection, absence de Linky ou
# d'index).
