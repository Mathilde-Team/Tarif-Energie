# Énergie et Services de Seyssel — TRV local, Tarif Bleu résidentiel (issues
# #253 Base, #254 HC ; phase 2 des ELD, #189). Seul fournisseur du TRV sur son
# réseau (Seyssel et Argonay, Haute-Savoie, ≤ 36 kVA) ; pas de filtre de zone
# dans le moteur (comme ÉS #72).
# Fiches de présentation standardisée « TARIF BLEU PARTICULIER OPTION BASE » et
# « TARIF BLEU DOMESTIQUE » (options Base et Heures Creuses), en vigueur
# depuis le 01/08/2025, relevées le 01/11/2026 avec pdftotext -layout. Le site
# de l'ELD (es-seyssel.com) est en panne ce jour (502) : fiches récupérées via
# l'archive web (web.archive.org, capture du 13/01/2026 de la page
# particuliers.html) — dernière édition publiée, donc la grille en vigueur au
# moteur. Abonnement publié en terme fixe mensuel TTC, distinct en Base et en
# HC (plus cher en HC) ; kWh Base 19,52 c€ uniforme de 3 à 36 kVA — les
# puissances Base 9-36 kVA sont EN EXTINCTION (« n'est plus proposé ») :
# publiées pour les contrats en cours. HC dès 6 kVA (pas de HC en 3 kVA),
# plages 23h-7h ou 22h-6h selon le code du point de livraison. Tempo et EJP
# (#255) non repris : le moteur ne connaît que Base et HC.
