# TotalEnergies Spéciale Électricité et Gaz, partie électricité — Base et HP/HC
# (issues #96 Base, #134 Heures creuses ; partie gaz documentée hors moteur, #112 ;
# inventaire #6). Offre duale électricité + gaz : le moteur ne compare que
# l'électricité. Décision du 28/10/2026 (commentaire de #96) : un fichier par
# offre, avec une copie de la grille de la partie électricité ; la grille élec
# est identique, à la date de la grille, à Heures Eco Électricité
# (totalenergies_heures_eco.yaml, #94 / #132) — le classement affiche donc deux
# lignes au même total. Offre indexée sur le TRVE (typologie CRE) : abonnement
# et kWh HT identiques au TRV, sans engagement. La page annonce « -10 % sur
# l'électricité et le gaz » mais la grille PDF est hors remise : la remise
# éventuelle n'est pas modélisée (assiette et durée absentes de la grille).
# Grille TTC « Offre - Spéciale - 1 oct. 2026 » (PDF officiel), à mettre à jour
# à chaque mouvement du TRV. Puissances intermédiaires Linky (4, 5, 7 kVA…)
# non reprises.
