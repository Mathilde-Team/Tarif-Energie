# résidentiel (issues #268 Base, #269 HC ; phase 2 des ELD, #189). Seul fournisseur
# du TRV sur son réseau (sud de La Réole, Gironde, ≤ 36 kVA) ; pas de filtre de
# zone dans le moteur (comme ÉS #72).
# Grille « TRVe Clients Résidentiels et Particuliers » applicable au 01/08/2025 —
# dernière édition publiée (aucune grille 2026 dans la médiathèque du site au
# 02/11/2026), relevée avec pdftotext -layout et recoupée visuellement. Comme pour
# le Seyssel (#253), la grille 2025 est reprise telle quelle en attendant la
# publication 2026. kWh Base uniforme ; HC de 6 à 36 kVA. Base 9-36 kVA en
# extinction (arrêté) mais publiée pour les contrats en cours. Majorations
# (auto-producteurs, non-Linky) non modélisées. Tempo et EJP non repris.
