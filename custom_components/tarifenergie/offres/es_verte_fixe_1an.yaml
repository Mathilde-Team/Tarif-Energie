# ÉS Énergies — Électricité verte à prix fixe 1 an (issues #73 Base, #329 HC ;
# inventaire #6).
# Offre réservée aux particuliers du territoire Strasbourg Électricité Réseaux
# (≤ 36 kVA) : le moteur n'a pas encore de filtre par zone (comme GEG #56).
# Grille TTC « applicable à compter du 1er octobre 2026 », page 1 (« Mise à
# jour : 01/10/2026 »), lue sur le rendu de la page. kWh Base : 0,30216 € pour
# 3 et 6 kVA, 0,29981 € de 9 à 36 kVA (cellules fusionnées). Pas d'HC en 3 kVA.
# Option Week-end Base (#330) : reprise ci-dessous (grille du 01/10/2026, même
# PDF). La variante « Week-end et heures creuses » (#331) et les options 100 %
# régionales (#333, #334) attendent les postes croisés HC × week-end. Abonnement
# Linky « légèrement inférieur de quelques centimes » selon la fiche : non
# modélisé (prix affichés retenus).
