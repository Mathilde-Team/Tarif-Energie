# surimpression dans le PDF : les abonnements TTC ci-dessous sont ceux du tableau).
# Non modélisés : le stockage virtuel (1 € HT par kWc et par mois ; kWh déstockés
# au prix de l'acheminement, 0,1110 € TTC/kWh) et les frais de mise en service.
# Grilles « Tarifs particuliers avec centrale photovoltaïque et stockage virtuel —
# Base, courte utilisation » et « Heures pleines / heures creuses, moyenne
# utilisation », au 01/08/2026, relevées le 04/11/2026 avec pdftotext -layout.
