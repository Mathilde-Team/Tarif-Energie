# mylight150 — Fourniture d'électricité Vert France, options Base (issue #66) et
# Heures creuses (issue #168) ; inventaire #6.
# Offre réservée aux foyers équipés de panneaux solaires : hors du classement par
# défaut, ajoutée par l'option « Foyer autoproducteur » (décision du 28/10/2026, #66).
# Indexée sur le TRV. Prix modélisé : l'offre de bienvenue des 12 premiers mois
# (kWh HT = TRV : Base 0,1361 jusqu'à 6 kVA, 0,1348 au-delà ; HP 0,1479, HC 0,1018),
# ce que paie un nouveau client (option 1 de la décision du 28/10/2026).
# Après 12 mois, prix « Vert France » NON modélisé (environ TRV +20,6 %) :
# Base 0,2336 € TTC (3-6 kVA) / 0,2320 € TTC (9-36 kVA), HP 0,2540, HC 0,19 € TTC.
# Abonnements (TTC/mois) au-dessus du TRV, identiques dans les deux phases.
# Non modélisés : majoration autoproducteur sans stockage virtuel (9,84 € HT/an),
# stockage virtuel MySmartBattery / MyBattery, pilotage MySmartPilot.
# HC de 6 à 36 kVA (pas de 3 kVA), heures creuses du gestionnaire de réseau (Enedis).
# Grille « Fourniture d'électricité Vert France » d'octobre 2026, pages 3-4
# (nouveaux clients dès le 01/10/2026, clients existants au 01/11/2026), PDF image
# relu visuellement le 04/11/2026. Plus de nouveaux clients sur le réseau
# Strasbourg Électricité Réseau depuis le 30/06/2026.
