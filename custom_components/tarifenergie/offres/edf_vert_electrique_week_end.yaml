# EDF Vert Électrique Week-End (issues #19 Base, #120 HC ; inventaire #6).
# Électricité verte (garanties d'origine). « Autre offre » selon la CRE : prix HT
# révisables au maximum deux fois par an — modélisée en prix fixes, la durée de
# fixité retenue (6 mois) étant l'intervalle minimal entre deux révisions (même
# arbitrage que Zen Week-End, #487). Grille TTC applicable au 15 septembre 2026
# (grille-prix-vert-electrique-weekend.pdf, vérifiée le 28/10/2026) : kWh HT 30 %
# moins cher les week-ends et jours fériés nationaux, compteur Linky requis.
# Pas de 3 kVA. Les abonnements 24 et 30 kVA de l'option HC (39,88 et 47,40 €/mois)
# diffèrent de l'option Week-End (39,14 et 46,47) : valeurs publiées telles
# quelles par EDF. Majorations (injection, sans index) non modélisées.
