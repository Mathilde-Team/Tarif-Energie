# Wekiwi — Offre Pierre — Base et HP/HC
# (issues #86 Base, #174 HP/HC ; inventaire #6). Électricité « au réel » :
# facturation mensuelle à la consommation réelle (pas un forfait), kWh HT fixes
# 1 an, relevés en TTC sur la page officielle le 19/10/2026, revérifiés
# inchangés le 01/11/2026 — Base 0,1882 € (3-6 kVA) / 0,1970 € (9-36 kVA) ;
# HP 0,2025 / HC 0,1601 €, toutes puissances. Les prix « remisés » ne sont pas
# modélisés (assiette et durée non publiées). Heures creuses : plages Enedis
# du point de livraison.
# Abonnement : non publié par Wekiwi — décision du propriétaire du 28/10/2026
# (même règle que l'Offre Duo, #183/#337) : abonnement du TRV en vigueur
# (grilles CRE du 01/08/2026, fichiers tarifs/Option_Base.csv et
# Option_HPHC.csv du dépôt), repris tel que publié en € TTC/an. Base 18-36 kVA
# en extinction (comme le TRV). Sans engagement.
