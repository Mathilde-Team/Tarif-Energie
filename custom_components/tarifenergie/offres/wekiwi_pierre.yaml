# Wekiwi — Offre Pierre — Base et HP/HC
# (issues #86 Base, #174 HP/HC ; inventaire #6). Électricité « au réel » :
# facturation mensuelle à la consommation réelle (pas un forfait), kWh HT fixes
# 1 an. Source : grille tarifaire officielle Wekiwi « wekiWEB | Pierre »,
# version du 1 mars 2026, en vigueur au 1 mars 2026
# (202603_EL_PART_FIX_WEB_SIMPLE-PIERRE.pdf, liée depuis la page Tarifs et CGV),
# lue le 03/11/2026 ; kWh identiques à la page de l'offre (19/10/2026,
# 01/11/2026, 03/11/2026). Prix « brut » TTC : Base 0,1882 € (3-6 kVA) /
# 0,1970 € (9-36 kVA) ; HP 0,2025 / HC 0,1601 €, toutes puissances. Remise
# digitale (0,015 € HT/kWh, perdue avant 12 mois) non modélisée.
# Abonnement : colonne TTC de la grille officielle (€/an ; TVA 20 %, CTA, taxes
# locales au plus haut, hypothèse Paris de la grille). Remplace l'abonnement
# TRV retenu faute de grille publiée (décision du propriétaire du 28/10/2026).
# HP/HC à partir de 6 kVA (pas de 3 kVA dans la grille). Heures creuses :
# plages Enedis du point de livraison. Sans engagement.
