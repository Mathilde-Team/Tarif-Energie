# ÉS Énergies — Prix fixe 1 an, Électricité verte 100 % régionale (issues #74
# Base, #332 HC ; inventaire #6). Même grille que es_verte_fixe_1an + colonne
# « Électricité Verte 100 % Régionale » de 2,27 € TTC/mois (1,90 € HTT) à toutes
# les puissances : le moteur n'a pas de champ supplément, il est AJOUTÉ à
# l'abonnement ci-dessous (ex. 3 kVA Base : 12,18 + 2,27 = 14,45 € TTC/mois).
# Offre réservée aux particuliers du territoire Strasbourg Électricité Réseaux
# (≤ 36 kVA) : le moteur n'a pas encore de filtre par zone (comme GEG #56).
# Grille TTC « applicable à compter du 1er octobre 2026 », page 1 (« Mise à
# jour : 01/10/2026 »), lue sur le rendu de la page. kWh Base : 0,30216 € pour
# 3 et 6 kVA, 0,29981 € de 9 à 36 kVA (cellules fusionnées). Pas d'HC en 3 kVA.
# Options Week-end : #333 (Base) et #334 (Week-end et heures creuses) reprises
# ci-dessous ; #331 (la variante HC de l'offre verte) est dans son propre
# fichier. Abonnement Linky « légèrement inférieur de
# quelques centimes » selon la fiche : non modélisé (prix affichés retenus).
