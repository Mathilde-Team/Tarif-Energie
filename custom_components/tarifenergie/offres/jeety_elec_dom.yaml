# Jeety Energy Elec-Dom (issues #59 Base, #161 HC ; inventaire #6). Ex-« élecocité »
# (jusqu'au 31/12/2025, ancien fournisseur ZE, société VA Contract SA) : particules
# alimentées 100 % renouvelables. Offre indexée sur le TRV, révisable à tout moment
# (CGV : « le fournisseur a le droit de réviser le prix du kWh... un mois de préavis »,
# réévaluation automatique à la hausse comme à la baisse), tout changement publié sur
# la page tarifs. Grille TTC « valable à partir du 1er février 2026 » : dernière grille
# publiée, non revue au mouvement du TRV du 01/08/2026 (les prix TTC du kWh restent
# ceux du TRV de février 2026, ex. Base 6 kVA 0,1940 € contre 0,1970 €) — à mettre à jour
# au prochain mouvement. Sans engagement, résiliation gratuite ; facturation au réel ou
# mensualisée (3, 6, 9 ou 12 mois) ; HC = celles du point de livraison (Enedis). HP/HC
# publiée dès 6 kVA seulement (3 kVA : « non indiqué »).
