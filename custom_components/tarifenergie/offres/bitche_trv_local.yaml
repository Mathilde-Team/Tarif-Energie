# Régie d'électricité de Bitche — TRV local, Tarif Bleu résidentiel (issues
# #283 Base, #284 HC ; phase 2 des ELD, #189). Seul fournisseur du TRV sur son
# réseau (Bitche, Moselle, ≤ 36 kVA) ; pas de filtre de zone dans le moteur
# (comme ÉS #72). Grille officielle du 01/08/2026 (PDF), abonnement publié en
# € TTC/an, repris tel quel. Composition TTC : abonnement + CTA (réseau ELD) +
# TVA 20 % ; kWh + accise + TVA 20 %. Base 9-36 kVA en extinction (arrêté du
# 28/01/2025) : publiée pour les contrats en cours. HC dès 3 kVA, plages
# 22h30-6h30 ou 0h-8h. Tempo (#285) de 6 à 36 kVA (pas de 3 kVA), HC 22h-6h, prix
# du barème national ; abonnement Tempo publié repris tel quel (6 kVA : 142,68 € HT,
# 201,41 € TTC, soit HT x 1,41), bien que sa composition TTC diffère de celle de la
# Base et des HC (HT x 1,20 exactement) : écart de la grille de l'ELD, relu dans le
# PDF le 04/11/2026.
