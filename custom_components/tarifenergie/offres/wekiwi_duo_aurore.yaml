# Les prix « remisés à l'entrée » ne sont pas modélisés (assiette et durée
# non publiées). Heures creuses : plages Enedis.
# Abonnement : non publié par Wekiwi — décision du propriétaire du 28/10/2026 :
# abonnement du TRV en vigueur (grilles CRE du 01/08/2026, fichiers
# tarifs/Option_Base.csv et Option_HPHC.csv du dépôt), repris tel que publié
# en € TTC/an. Base 18-36 kVA en extinction (comme le TRV). Sans engagement.
