# Régie Services Énergie (Ambérieux-en-Dombes) — TRV local, Tarif Bleu
# résidentiel (issues #294 Base, #295 HC ; phase 2 des ELD, #189). Seul fournisseur
# du TRV sur son réseau (19 communes de l'Ain, ≤ 36 kVA) ; pas de filtre de zone
# dans le moteur (comme ÉS #72).
# Grille « Tarifs Réglementés de Vente applicables au 1er février 2026 (Contrats
# Résidentiels) » — dernière édition publiée (aucune grille 08/2026 sur le site de
# l'ELD au 03/11/2026, la page TRV présente toujours cette grille comme en
# vigueur), relevée avec pdftotext -layout et recoupée visuellement avec le rendu
# du PDF. Reprise telle quelle, comme pour le Seyssel (#253) et le Sud-La-Réole
# (#268). Abonnements annuels TTC (facturation trimestrielle) ; Base 9-36 kVA en
# extinction (« TARIFS EN EXTINCTION, NE SONT PLUS PROPOSES A LA CLIENTELE »)
# mais publiée pour les contrats en cours ; Double Tarif (HP/HC) de 6 à 36 kVA,
# HC 23 h - 7 h. Tempo complet publié mais non repris.
