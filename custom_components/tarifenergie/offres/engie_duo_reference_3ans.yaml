# Engie Duo Référence 3 ans, partie électricité — option Base (issue #98 ;
# option HP/HC en #135 ; partie gaz documentée hors moteur, #113 ; inventaire #6).
# Offre mixte électricité + gaz : le moteur ne compare que l'électricité, la
# grille ci-dessous est la partie électricité de la fiche descriptive d'octobre
# 2026. Décision du 28/10/2026 (commentaire de #98) : un fichier par offre, avec
# une copie de la grille de la partie électricité ; la partie élec est identique,
# à la date de la grille, à Elec Référence 3 ans (engie_elec_reference_3ans.yaml,
# #28 / #127). Une éventuelle remise propre au Duo n'est pas modélisée.
# « Prix fixe de la part fourniture » 3 ans (typologie CRE) : seule la fourniture
# est fixe ; l'acheminement suit le TURPE et les obligations (CEE, capacité)
# varient dans la limite d'un plafond. Prix publiés en trois parts, TTC « hors
# évolution des impôts » ; chaque total ci-dessous est la somme fourniture +
# acheminement + obligations (prix à la souscription), avec l'acheminement
# courant CU (Base) : fourniture 45,79 €/an et 16,379 c€, CU 5,988 c€,
# obligations 1,838 c€ (3-6 kVA) ou 2,010 c€ (9-36 kVA). Les options
# d'acheminement CU4 et MU4 (4 plages saisonnières) ne sont pas reprises.
# Abonnement publié en €/an : abonnement_annuel_ttc (fourniture + acheminement).
