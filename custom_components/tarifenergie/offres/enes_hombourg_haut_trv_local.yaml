# Enes Hombourg-Haut — TRV local, Tarif Bleu résidentiel (issues #277 Base,
# #278 HC ; phase 2 des ELD, #189). Seul fournisseur du TRV sur son réseau
# (Hombourg-Haut, Moselle, ≤ 36 kVA) ; pas de filtre de zone dans le moteur
# (comme ÉS #72). Décision du propriétaire du 28/10/2026 : un fichier par
# commune. Enes publie une grille unique pour ses régies (Creutzwald,
# Hombourg-Haut, Schoeneck) sous le dossier « creutzwald » de son site : les
# mêmes images servent aux trois communes, valeurs du barème du 01/08/2026
# (mêmes prix que Enes Creutzwald, #275/#276). Grilles publiées en images
# (« Service Base » et « Service Heures creuses / Heures pleines », année
# 2026). Abonnement + CTA publié en € TTC/an et en € TTC/mois : l'annuel,
# plus précis, est retenu. kWh Base : 0,20006 € pour 3 et 6 kVA, 0,19850 €
# de 9 à 36 kVA, en extinction pour les contrats en cours. HC dès 3 kVA ;
# l'abonnement HC 3 kVA est publié à 184,92 €/an (15,41 €/mois), bien
# au-dessus des autres ELD : repris tel que publié. Pas de Tempo publié.
