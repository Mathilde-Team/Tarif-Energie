# EDF Zen Week-End (issues #12 Base, #117 HC ; inventaire #6).
# « Autre offre » selon la CRE : prix fixés librement, révisables au maximum
# deux fois par an — modélisée en prix fixes, la durée de fixité retenue (6 mois)
# étant l'intervalle minimal entre deux révisions (même arbitrage que Zen
# Week-End Plus #486). Abonnement HT, kWh HT ; grille TTC applicable au
# 15 septembre 2026 (grille-prix-zen-week-end.pdf, vérifiée le 28/10/2026) :
# kWh 30 % moins cher les week-ends et jours fériés nationaux, sans jour choisi
# (c'est la différence avec Zen Week-End Plus). Pas d'option HC en 3 kVA ;
# l'option EJP et les majorations (injection, sans Linky…) ne sont pas
# modélisées.
