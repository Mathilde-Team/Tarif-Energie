# EDF Zen Week-End Plus (issues #10 Base, #116 HC ; inventaire #6).
# « Autre offre » selon la CRE : prix fixés librement, révisables au maximum
# deux fois par an — modélisée en prix fixes, la durée de fixité retenue (6 mois)
# étant l'intervalle minimal entre deux révisions. Abonnement HT, kWh HT ;
# grille TTC applicable au 15 septembre 2026 (grille-prix-zen-week-end-plus.pdf),
# sans 3 kVA. Gestion 100 % en ligne ; l'option V2G n'est pas reprise et les
# majorations EJP (0,02 €) et Tempo (0,03 €) ne sont pas modélisées (issues EDF#8).
# Option « Week-End + jour choisi » : le client choisit lundi, mercredi ou vendredi,
# les trois variantes sont simulées (une clé de comparaison par jour choisi) ; en
# heures creuses, la remise s'applique aux HP ET HC des week-ends, jours fériés
# nationaux et jours choisis. Vérifié sur la page EDF au 28/10/2026.
